<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>ZamZam — Boshqaruv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
<style>
/* ============ Dizayn tokenlari (yorug' / qorong'i) ============ */
:root{--bg:#eef4ff;--surface:#fff;--surface2:#f4f8ff;--ink:#13254a;--ink2:#334155;--mute:#8590a2;--line:#dfe8fa;
  --b:#2b6cf6;--b2:#1d4ed8;--bl:#eaf1ff;--ok:#12a150;--okl:#e3f8ec;--warn:#b26b00;--warnl:#fff4dc;--red:#e5383b;--redl:#fdeaea;
  --violet:#7c3aed;--violetl:#f1eafe;--sh:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.06);--r:18px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font:500 15px/1.45 Manrope,-apple-system,system-ui,sans-serif;color:var(--ink);padding-top:env(safe-area-inset-top);-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
iconify-icon{display:inline-block;vertical-align:middle;flex:none}
#app{max-width:640px;margin:0 auto;padding:0 14px calc(92px + env(safe-area-inset-bottom))}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:14px 2px 12px}
.hd small{display:block;color:var(--mute);font-size:13px;font-weight:600}
.hd h1{font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}
.sec h2{font-size:16px;font-weight:800;letter-spacing:-.01em}
.sec a,.sec button.link{font-size:13px;font-weight:700;color:var(--b);background:none;border:0;cursor:pointer;text-decoration:none}
.mute{color:var(--mute)}.small{font-size:13px}
.ok{color:var(--ok)}.red{color:var(--red)}.warnc{color:var(--warn)}

/* ============ Elementlar ============ */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:14px 16px}
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:62px;right:0;height:1px;background:var(--line)}
.row:active{background:var(--surface2)}
.row .grow{flex:1;min-width:0}
.row b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--bl);color:var(--b)}
.ic.ok{background:var(--okl);color:var(--ok)}.ic.warn{background:var(--warnl);color:var(--warn)}.ic.red{background:var(--redl);color:var(--red)}
.ic.grey{background:var(--surface2);color:var(--mute)}.ic.violet{background:var(--violetl);color:var(--violet)}
.ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:14px;color:#fff;position:relative;background:linear-gradient(135deg,#4f8bff,#1d4ed8)}
.ava i{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--surface);background:#c3c9d4}
.ava i.on{background:var(--ok)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--bl);color:var(--b);white-space:nowrap}
.badge.ok{background:var(--okl);color:var(--ok)}.badge.warn{background:var(--warnl);color:var(--warn)}.badge.red{background:var(--redl);color:var(--red)}
.badge.grey{background:var(--surface2);color:var(--mute)}.badge.violet{background:var(--violetl);color:var(--violet)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#c3c9d4}.dot.on{background:var(--ok);box-shadow:0 0 0 3px var(--okl)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;background:var(--surface2);color:var(--ink);transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.b{background:var(--b);color:#fff}.btn.red{background:var(--redl);color:var(--red)}.btn.ok{background:var(--okl);color:var(--ok)}
.btn:disabled{opacity:.5}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:99px;padding:8px 13px;font-size:13px;font-weight:700;background:var(--bl);color:var(--b);cursor:pointer;white-space:nowrap;text-decoration:none}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:10px;font-size:13px;font-weight:700;color:var(--mute);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.seg button em{font-style:normal;color:var(--mute);font-weight:600;margin-left:3px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:0 12px;margin-bottom:10px;box-shadow:var(--sh);color:var(--mute)}
.search input{flex:1;border:0;background:none;padding:13px 0;font:inherit;color:var(--ink);outline:0}
input.in,textarea.in{width:100%;font:inherit;color:var(--ink);background:var(--surface2);border:1.5px solid transparent;border-radius:12px;padding:13px 14px;outline:0;margin-bottom:10px}
input.in:focus,textarea.in:focus{border-color:var(--b);background:var(--surface)}
label.lb{display:block;font-size:12px;font-weight:700;color:var(--mute);margin:2px 2px 6px;text-transform:uppercase;letter-spacing:.04em}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:var(--ok)}.sw.on::after{transform:translateX(18px)}
.empty{text-align:center;color:var(--mute);padding:36px 16px}
.empty iconify-icon{color:var(--b);opacity:.6;margin-bottom:6px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:14px}
.kv+.kv{border-top:1px solid var(--line)}
.kv>span{color:var(--mute)}.kv b{text-align:right;font-weight:700}

/* KPI */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:14px;display:flex;flex-direction:column;gap:6px;min-height:96px}
.kpi .t{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:12px;font-weight:700}
.kpi .v{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi .s{font-size:12px;color:var(--mute);font-weight:600}
.kpi.hero{grid-column:1/-1;background:linear-gradient(135deg,#3b7bff,#1d4ed8);color:#fff}
.kpi.hero .t,.kpi.hero .s{color:rgba(255,255,255,.8)}.kpi.hero .v{font-size:30px}
.alert{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;margin-bottom:8px;cursor:pointer;font-weight:700}
.alert small{display:block;font-weight:600;opacity:.8;font-size:12px}
.alert.red{background:var(--redl);color:var(--red)}.alert.warn{background:var(--warnl);color:var(--warn)}.alert.blue{background:var(--bl);color:var(--b)}
.alert .grow{flex:1}
/* Bosh sahifa (sodda) */
.money{background:linear-gradient(135deg,#3b7bff,#1d4ed8);color:#fff;border-radius:24px;padding:18px 18px 16px;box-shadow:0 12px 28px rgba(43,108,246,.28);animation:fade .3s}
.money .t{font-size:14px;font-weight:700;opacity:.85}
.money .v{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:4px 0 14px}
.money .g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.money .g div{background:rgba(255,255,255,.14);border-radius:14px;padding:9px 10px}
.money .g b{display:block;font-size:17px;font-weight:800}.money .g small{font-size:12px;opacity:.85;font-weight:600}
.allok{display:flex;align-items:center;gap:10px;background:var(--okl);color:var(--ok);border-radius:16px;padding:14px;font-weight:700}
.big b{font-size:16px}.big small{font-size:14px}
.chart{display:flex;align-items:flex-end;gap:6px;height:110px;padding:6px 2px 0}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--bl);min-height:4px;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.chart div.today i{background:var(--b)}
.chart span{font-size:11px;color:var(--mute);font-weight:700}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin-bottom:12px}
.pod{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.pod .m{font-size:26px;line-height:1}
.pod b{font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .sc{font-size:20px;font-weight:800;color:var(--b)}
.pod.first{padding:18px 8px;background:linear-gradient(180deg,var(--warnl),var(--surface))}
.timeline{display:flex;gap:6px;margin:4px 0 14px}
.timeline div{flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--mute)}
.timeline div i{display:block;height:5px;border-radius:9px;background:var(--line);margin-bottom:6px}
.timeline div.on{color:var(--ink)}.timeline div.on i{background:var(--b)}
.timeline div.red i{background:var(--red)}
.ostat{width:4px;align-self:stretch;border-radius:4px;flex:none;margin:-4px 0}
.thumb{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none;background:var(--surface2)}
.pw{font:800 20px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.06em;background:var(--surface2);border-radius:12px;padding:14px;text-align:center;margin-bottom:10px;user-select:all}
.note{background:var(--warnl);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;margin-top:8px}
.note.red{background:var(--redl);color:var(--red)}
.skel{background:linear-gradient(90deg,var(--surface2),var(--line),var(--surface2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r)}
@keyframes sk{to{background-position:-200% 0}}
.fade{animation:fade .25s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}

/* Pastki menyu */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:700;color:var(--mute);cursor:pointer;position:relative}
nav button.on{color:var(--b)}
nav button i{position:absolute;top:1px;left:calc(50% + 6px);background:var(--red);color:#fff;font-style:normal;font-size:10px;font-weight:800;min-width:17px;height:17px;line-height:17px;border-radius:99px;padding:0 4px}

/* Pastdan chiquvchi oyna */
.sheetbg{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:40;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:640px;margin:0 auto;background:var(--bg);border-radius:24px 24px 0 0;max-height:92vh;overflow-y:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet h3{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.sheet .sub{color:var(--mute);font-size:13px;margin-bottom:14px}
.sheet .card,.sheet .list{margin-bottom:10px}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);z-index:60;background:var(--b);color:#fff;box-shadow:0 8px 20px rgba(43,108,246,.35);font-weight:700;padding:10px 16px;border-radius:99px;display:none;max-width:92%;text-align:center;font-size:14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div style="padding:40vh 0;text-align:center;color:var(--b)"><iconify-icon icon="svg-spinners:ring-resize" width="40"></iconify-icon></div></div>
<nav id="nav" style="display:none"></nav>
<div id="sheets"></div>
<div id="toast"></div>

<script>
"use strict";
// ======================================================================= Asos
const tgw = window.Telegram && window.Telegram.WebApp;
const API = new URLSearchParams(location.search).get("api") || "https://zamzam-bot-kljv.onrender.com";
const $ = (id) => document.getElementById(id);
const ic = (n, s = 20) => `<iconify-icon icon="solar:${n}" width="${s}" height="${s}"></iconify-icon>`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (n) => Math.round(Number(n) || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const money = (n) => num(n) + " so'm";
const short = (n) => { n = Number(n) || 0; return n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(".0", "") + " mln" : n >= 1e4 ? Math.round(n / 1e3) + " ming" : num(n); };
const haptic = (t = "light") => { try { tgw.HapticFeedback.impactOccurred(t); } catch {} };
const TZ = () => S.d?.settings?.tz || "Asia/Tashkent";
const fmtTime = (iso) => (iso ? new Date(iso).toLocaleTimeString("ru-RU", { timeZone: TZ(), hour: "2-digit", minute: "2-digit" }) : "—");
const fmtDate = (iso) => (iso ? new Date(iso).toLocaleString("ru-RU", { timeZone: TZ(), day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—");
function ago(iso) {
  if (!iso) return "—";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "hozirgina";
  if (m < 60) return `${m} daq oldin`;
  if (m < 1440) return `${Math.floor(m / 60)} soat oldin`;
  return fmtDate(iso);
}
const hm = (min) => { const m = Math.max(0, Math.round(Number(min) || 0)); return m >= 60 ? `${Math.floor(m / 60)} soat ${m % 60} daq` : `${m} daq`; };
const sinceMin = (iso) => (iso ? (Date.now() - new Date(iso)) / 60000 : 0);
const initials = (n) => String(n || "?").trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
const mapLink = (lat, lon) => `https://yandex.uz/maps/?pt=${lon},${lat}&z=17&l=map`;
const tel = (p) => String(p || "").replace(/[^\d+]/g, "");
function genPassword() {
  const abc = "abcdefghjkmnpqrstuvwxyz23456789";
  return [...crypto.getRandomValues(new Uint8Array(8))].map((x) => abc[x % abc.length]).join("");
}
function toast(text, ms = 2600) {
  const t = $("toast"); t.textContent = text; t.style.display = "block";
  clearTimeout(toast.h); toast.h = setTimeout(() => (t.style.display = "none"), ms);
}
async function call(action, data = {}) {
  const res = await fetch(API + "/api", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ initData: tgw.initData, action, ...data }) });
  let j = {};
  try { j = await res.json(); } catch {}
  if (!res.ok || j.error) throw new Error(j.error || "Internet bilan muammo. Qayta urinib ko'ring.");
  return j;
}
const run = async (fn, okText) => {
  try { const r = await fn(); if (okText) { toast(okText); try { tgw.HapticFeedback.notificationOccurred("success"); } catch {} } return r; }
  catch (e) { toast(e.message, 4000); try { tgw.HapticFeedback.notificationOccurred("error"); } catch {} return null; }
};

const STATUS = {
  new: ["Yangi", "warn", "#f59e0b"], offered: ["Taklif qilingan", "warn", "#f59e0b"], unassigned: ["Dostavchi yo'q", "red", "#e5383b"],
  accepted: ["Yo'lda", "", "#2b6cf6"], delivered: ["Yetkazildi", "ok", "#12a150"], cancelled: ["Bekor", "grey", "#c3c9d4"],
};
const OFFER = { pending: "kutmoqda", accepted: "qabul qildi", declined: "rad etdi", expired: "javob bermadi", cancelled: "bekor", released: "qaytardi" };
const WAIT = ["new", "offered", "unassigned"];

const S = { tab: "home", d: null, today: null, week: null, team: null, tdays: 1, staff: null, ofilter: "wait", oq: "", tview: "list", rdays: 30,
            cfilter: "all", cq: "", sdays: 1, sheets: [] };
const X = () => S.d?.extra || { cash: {}, cash_total: 0, ratings: [], disputes: [] };
const cashOf = (tg) => Number(X().cash[String(tg)] || 0);

// ======================================================================= Ishga tushirish
function applyTheme() {
  document.documentElement.dataset.theme = "light";
  try { tgw.setHeaderColor("#eef4ff"); tgw.setBackgroundColor("#eef4ff"); } catch {}
}
function fatal(icon, title, text) {
  $("nav").style.display = "none";
  $("app").innerHTML = `<div class="empty" style="padding-top:26vh">${ic(icon, 56)}<h2 style="margin:8px 0 6px;color:var(--ink)">${title}</h2><div>${text}</div></div>`;
}
async function boot() {
  if (!tgw || !tgw.initData) return fatal("smartphone-2-bold-duotone", "Bot orqali oching", "Boshqaruv paneli xodimlar botidagi «Panel» tugmasi orqali ochiladi.");
  tgw.ready(); tgw.expand(); applyTheme();
  try { tgw.BackButton.onClick(closeSheet); tgw.disableVerticalSwipes?.(); } catch {}
  try { S.d = await call("a_overview"); } catch (e) { return fatal("shield-cross-bold-duotone", "Kirish mumkin emas", esc(e.message)); }
  render();
  loadToday();
  const m = location.hash.match(/^#order-(\d+)$/);
  if (m) openOrder(Number(m[1]));
  setInterval(() => { if (!document.hidden && !S.sheets.length) refresh(); }, 15000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !S.sheets.length) refresh(); });
}
async function refresh() {
  const d = await call("a_overview").catch(() => null);
  if (!d) return;
  S.d = d;
  if (S.tab === "home") loadToday(); else if (S.tab === "orders" && !S.sheets.length && document.activeElement?.id !== "oq") renderOrders();
  renderNav();
}
async function loadToday() {
  const [t, tm, st] = await Promise.all([call("a_stats", { days: 1 }).catch(() => null), call("a_team", { days: 1 }).catch(() => null),
                                         call("a_staff").catch(() => null)]);
  if (t) S.today = t;
  if (tm) S.homeTeam = tm;
  if (st) S.staff = st;
  if (S.tab === "home" && !S.sheets.length) renderHome();
}

// ======================================================================= Navigatsiya
const TABS = [["home", "home-smile-bold-duotone", "Bugun"], ["orders", "box-bold-duotone", "Buyurtmalar"], ["team", "users-group-rounded-bold-duotone", "Xodimlar"],
              ["more", "widget-5-bold-duotone", "Boshqa"]];
function renderNav() {
  const wait = S.d.orders.filter((o) => WAIT.includes(o.status)).length;
  const disp = X().disputes.length;
  const cur = ["products", "stats", "settings", "banners", "clients"].includes(S.tab) ? "more" : S.tab;
  $("nav").style.display = "flex";
  $("nav").innerHTML = TABS.map(([k, i, t]) => `<button class="${cur === k ? "on" : ""}" onclick="go('${k}')">${ic(i, 24)}${t}` +
    `${k === "orders" && wait ? `<i>${wait}</i>` : ""}${k === "home" && disp ? `<i>${disp}</i>` : ""}</button>`).join("");
}
function go(tab, opts = {}) { S.tab = tab; Object.assign(S, opts); haptic(); render(); window.scrollTo(0, 0); }
function render() {
  renderNav();
  ({ home: renderHome, orders: renderOrders, team: renderTeam, clients: renderClients, more: renderMore,
     products: renderProducts, stats: renderStats, settings: renderSettings, banners: renderBanners })[S.tab]();
}
const head = (title, sub = "", right = "") => `<div class="hd"><div><small>${sub}</small><h1>${title}</h1></div>${right}</div>`;
const back = (to = "more") => `<button class="pill" onclick="go('${to}')">${ic("alt-arrow-left-linear", 16)} Orqaga</button>`;

// ======================================================================= Pastdan oyna (sheet)
function sheet(html) {
  const wrap = document.createElement("div");
  wrap.innerHTML = `<div class="sheetbg"></div><div class="sheet"><div class="grab"></div>${html}</div>`;
  wrap.querySelector(".sheetbg").onclick = closeSheet;
  $("sheets").appendChild(wrap);
  S.sheets.push(wrap);
  try { tgw.BackButton.show(); } catch {}
  return wrap;
}

function assignPicker(id) {
  const o = findOrder(id);
  const hv = (a, b, c, d) => { const r = (x) => (x * Math.PI) / 180; const h = Math.sin(r(c - a) / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(r(d - b) / 2) ** 2; return 12742 * Math.asin(Math.min(1, Math.sqrt(h))); };
  const list = S.d.couriers.filter((c) => c.is_active && c.tg_id !== o.courier_id)
    .map((c) => ({ ...c, dist: c.lat != null ? hv(o.lat, o.lon, c.lat, c.lon) : null }))
    .sort((a, b) => (Number(b.is_online) - Number(a.is_online)) || ((a.dist ?? 1e9) - (b.dist ?? 1e9)));
  sheet(`<h3>Dostavchini tanlang</h3><div class="sub">Ishdagilar tepada. Masofa — dostavchining oxirgi ma'lum joyidan, taxminiy.</div>` +
    (list.length ? `<div class="list">${list.map((c) => `<div class="row" onclick="assign(${id},${c.tg_id})"><div class="ava">${esc(initials(c.name))}<i class="${c.is_online ? "on" : ""}"></i></div>

async function courierTab(tg, tab) {

      <div class="grow"><b>${fmtDate(x.started_at)} → ${x.ended_at ? fmtTime(x.ended_at) : "hozir ishda"}</b><small>${new Date(x.started_at).toLocaleDateString("ru-RU", { timeZone: TZ() })}</small></div>
      <div class="end"><b>${hm(x.minutes)}</b></div></div>`).join("")}</div>` : `<div class="card empty" style="padding:20px">Smena bo'lmagan</div>`;
  if (tab === "cash") el.innerHTML = d.cash.length ? `<div class="list">${d.cash.map((c) => `<div class="row" style="cursor:default"><div class="ic ${c.delta > 0 ? "warn" : "ok"}">${ic(c.delta > 0 ? "wallet-money-bold" : "hand-money-bold", 20)}</div>

async function renderBanners() {

        <span class="badge ${b.is_active ? "ok" : "grey"}">${b.is_active ? "ko'rsatilmoqda" : "o'chirilgan"}</span></div>
        <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
          <button class="pill" onclick="bannerOp(${b.id},'toggle')">${ic(b.is_active ? "eye-closed-bold" : "eye-bold", 16)} ${b.is_active ? "Yashirish" : "Ko'rsatish"}</button>
          ${i > 0 ? `<button class="pill" onclick="bannerOp(${b.id},'up')">${ic("arrow-up-bold", 16)}</button>` : ""}
          ${i < list.length - 1 ? `<button class="pill" onclick="bannerOp(${b.id},'down')">${ic("arrow-down-bold", 16)}</button>` : ""}
          <button class="pill" onclick="bannerTitle(${b.id})">${ic("pen-bold", 16)} Matn</button>
          <button class="pill" style="background:var(--redl);color:var(--red)" onclick="bannerOp(${b.id},'delete')">${ic("trash-bin-trash-bold", 16)}</button></div></div></div>`).join("")
    : `<div class="card empty">${ic("videocamera-record-bold-duotone", 44)}<br>Hali banner yo'q.<br>Banner bo'lmasa mijozga oddiy salomlashuv kartasi ko'rinadi.</div>`;
}
async function uploadBanner(input) {
  const f = input.files && input.files[0];
  input.value = "";
  if (!f) return;
  const st = $("upst");
  const sig = await run(() => call("a_banner_upload", { type: f.type, size: f.size }));
  if (!sig) return;
  st.innerHTML = `<div class="card pad" style="margin-bottom:10px"><b>Yuklanmoqda…</b> <span id="uppct">0%</span><div style="height:6px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden"><i id="upbar" style="display:block;height:100%;width:0;background:var(--b);transition:width .2s"></i></div></div>`;
  const ok = await new Promise((resolve) => {
    const fd = new FormData();
    fd.append("cacheControl", "31536000");
    fd.append("", f);
    const xhr = new XMLHttpRequest();
    xhr.open("PUT", sig.upload_url);
    xhr.setRequestHeader("x-upsert", "true");
    xhr.upload.onprogress = (e) => { if (e.lengthComputable) { const p = Math.round((e.loaded / e.total) * 100); $("uppct").textContent = p + "%"; $("upbar").style.width = p + "%"; } };
    xhr.onload = () => resolve(xhr.status >= 200 && xhr.status < 300);
    xhr.onerror = () => resolve(false);
    xhr.send(fd);
  });
  st.innerHTML = "";
  if (!ok) return toast("Yuklab bo'lmadi. Internetni tekshirib, qayta urinib ko'ring.", 4000);
  if (await run(() => call("a_banner_create", { kind: sig.kind, url: sig.public_url, title: "" }), "✅ Banner qo'shildi. Matn qo'shish uchun «Matn» tugmasini bosing.")) renderBanners();
}
async function bannerOp(id, op) {
  const doIt = async (yes) => { if (yes && (await run(() => call("a_banner_update", { id, op })))) renderBanners(); };
  if (op === "delete") return tgw.showConfirm ? tgw.showConfirm("Banner o'chirilsinmi?", doIt) : doIt(confirm("Banner o'chirilsinmi?"));
  doIt(true);
}
function bannerTitle(id) {
  sheet(`<h3>Banner matni</h3><div class="sub">Rasm/video pastida ko'rinadi. Bo'sh qoldirsa — matnsiz.</div>
    <input class="in" id="btitle" maxlength="80" placeholder="Masalan: 19 litr — 15 000 so'm!">
    <button class="btn b" onclick="saveBannerTitle(${id})">Saqlash</button>`);
}
async function saveBannerTitle(id) {
  if (await run(() => call("a_banner_update", { id, op: "title", title: $("btitle").value }), "✅ Saqlandi")) { closeAll(); renderBanners(); }
}

function openProduct(id) {
  const p = id ? S.d.products.find((x) => x.id === id) : { title: "", price: "", wholesale_price: null, returnable: false, is_active: true, description: "", volume_l: null, image_url: null };
  S.pimg = null;
  sheet(`<h3>${id ? "Mahsulotni tahrirlash" : "Yangi mahsulot"}</h3><div class="sub">Rasm va narx mijoz katalogida ko'rinadi</div>

    <div class="list">
      <div class="row" onclick="this.querySelector('.sw').classList.toggle('on')"><div class="grow"><b>Bo'sh idish qaytariladi</b><small>Idishlar hisobi yuritiladi (hajmi kerak)</small></div><div id="ret" class="sw ${p.returnable ? "on" : ""}"></div></div>
      ${id ? `<div class="row" onclick="this.querySelector('.sw').classList.toggle('on')"><div class="grow"><b>Sotuvda</b><small>O'chirilsa mijozlarga ko'rinmaydi</small></div><div id="act" class="sw ${p.is_active ? "on" : ""}"></div></div>` : ""}
    </div>
    <button id="psave" class="btn b" onclick="saveProduct(${id})">Saqlash</button>`);

function pickImage(input) {
  const f = input.files && input.files[0];
  if (!f || !/^image\//.test(f.type)) return toast("Rasm tanlang");
  const img = new Image();
  img.onload = () => {
    const k = Math.min(1, 900 / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    S.pimg = c.toDataURL("image/jpeg", 0.82);
    URL.revokeObjectURL(img.src);
    $("imgprev").outerHTML = `<img id="imgprev" src="${S.pimg}" style="width:100%;height:100%;object-fit:cover">`;
  };
  img.onerror = () => toast("Rasmni o'qib bo'lmadi");
  img.src = URL.createObjectURL(f);
}
async function saveProduct(id) {
  const title = $("ptitle").value.trim(), price = $("price").value.replace(/\s/g, ""), wprice = $("wprice").value.replace(/\s/g, "");
  if (title.length < 2) return toast("Nomini kiriting");
  if (!/^\d{1,8}$/.test(price)) return toast("Narxni to'g'ri kiriting");
  if (wprice && !/^\d{1,8}$/.test(wprice)) return toast("Optom narxni to'g'ri kiriting");
  if (wprice && Number(wprice) > Number(price)) return toast("Optom narx dona narxdan qimmat bo'lmasin");
  const btn = $("psave"); btn.disabled = true;
  try {
    let pid = id;
    if (!id) {
      const r = await run(() => call("a_product_create", { title, price, wholesale_price: wprice || null, volume_l: $("pvol").value.trim() || null,
        returnable: $("ret").classList.contains("on"), description: $("pdesc").value.trim() }));
      if (!r) return;
      pid = r.id;
    } else if (!(await run(() => call("a_product", { id, title, description: $("pdesc").value.trim(), price, wholesale_price: wprice || null,
        returnable: $("ret").classList.contains("on"), is_active: $("act").classList.contains("on") })))) return;
    if (S.pimg) {
      btn.innerHTML = '<iconify-icon icon="svg-spinners:ring-resize" width="20"></iconify-icon> Rasm yuklanmoqda...';
      if (!(await run(() => call("a_product_image", { id: pid, data: S.pimg })))) return;
    }
    toast("✅ Saqlandi"); closeAll(); await refresh(); renderProducts();
  } finally { if ($("psave")) { btn.disabled = false; btn.textContent = "Saqlash"; } }
}
function editFee() {
  sheet(`<h3>Yetkazish narxi</h3><div class="sub">0 — bepul yetkazish</div>

async function saveSetting(key, value) {

// ---------------------------------------------------------------- Hisobot
async function renderStats() {
  const seg = (d, t) => `<button class="${S.sdays === d ? "on" : ""}" onclick="S.sdays=${d};renderStats()">${t}</button>`;
  $("app").innerHTML = head("Hisobot", "Yetkazilgan buyurtmalar bo'yicha", back()) + `<div class="seg">${seg(1, "Bugun")}${seg(7, "7 kun")}${seg(30, "30 kun")}</div><div id="sb"><div class="skel" style="height:320px"></div></div>`;
  const st = await run(() => call("a_stats", { days: S.sdays }));
  if (!st || S.tab !== "stats") return;
  let chart = "";
  if (S.sdays > 1) {
    const map = Object.fromEntries(st.daily.map((d) => [d.day, Number(d.revenue)]));
    const days = [];
    for (let i = S.sdays - 1; i >= 0; i--) days.push(new Date(Date.now() - i * 864e5).toLocaleDateString("sv-SE", { timeZone: TZ() }));
    const max = Math.max(1, ...days.map((k) => map[k] || 0));
    chart = `<div class="card pad" style="margin-top:10px"><div class="chart" style="gap:${S.sdays > 7 ? 2 : 6}px">${days.map((k, i) => `<div class="${i === days.length - 1 ? "today" : ""}"><i style="height:${Math.max(4, ((map[k] || 0) / max) * 100)}%"></i><span>${S.sdays === 7 || i % 5 === 4 ? k.slice(8) : "&nbsp;"}</span></div>`).join("")}</div></div>`;
  }
  $("sb").innerHTML = `<div class="kpis fade">
      <div class="kpi hero"><div class="t">${ic("graph-up-bold", 16)} Sotuv</div><div class="v">${money(st.revenue)}</div><div class="s">${st.delivered} ta yetkazildi · ${st.created} ta tushdi · ${st.cancelled} bekor</div></div>
      <div class="kpi"><div class="t">${ic("wad-of-money-bold", 16)} Naqd tushdi</div><div class="v">${short(st.cash)}</div><div class="s">${Number(st.wholesale) ? "optom: " + short(st.wholesale) : "so'm"}</div></div>
      <div class="kpi"><div class="t">${ic("bill-list-bold", 16)} Qarz</div><div class="v ${Number(st.new_debt) ? "red" : ""}">+${short(st.new_debt)}</div><div class="s">to'landi: ${short(st.debt_paid)} · jami: ${short(st.debt_total)}</div></div></div>
    ${chart}
    ${Number(st.defective) ? `<div class="note">${ic("danger-triangle-bold", 16)} Yaroqsiz tara (qabul qilinmagan): ${st.defective} ta</div>` : ""}
    <div class="sec"><h2>Mahsulotlar</h2></div>
    <div class="card pad">${st.products.length ? st.products.map((p) => `<div class="kv"><span>${esc(p.title)} · ${p.qty} ta</span><b>${money(p.sum)}</b></div>`).join("") : `<div class="mute">Sotuv yo'q</div>`}</div>
    <div class="sec"><h2>Dostavchilar</h2></div>
    <div class="list">${st.couriers.length ? st.couriers.map((c) => `<div class="row"><div class="ava">${esc(initials(c.name))}</div><div class="grow"><b>${esc(c.name)}</b><small>${c.n} ta yetkazdi${Number(c.debt) ? ` · qarzga ${short(c.debt)}` : ""}</small></div><div class="end"><b>${money(c.cash)}</b><small class="mute small">naqd</small></div></div>`).join("") : `<div class="empty">Ma'lumot yo'q</div>`}</div>`;
}

function editFactory() {
  const s = S.d.settings;
  sheet(`<h3>Zavod joylashuvi</h3><div class="sub">Smena boshida dostavchi shu yerda deb hisoblanadi, keyin — u oxirgi yetkazgan manzil. Buyurtma eng yaqiniga beriladi.</div>
    <button class="btn b" onclick="factoryHere()">${ic("gps-bold", 20)} Hozir zavoddaman — joyimni olish</button>
    <label class="lb" style="margin-top:14px">Yoki koordinata</label>
    <input class="in" id="fv" inputmode="decimal" placeholder="41.3111, 69.2797" value="${s.factory_lat != null ? `${s.factory_lat}, ${s.factory_lon}` : ""}">
    <button class="btn" onclick="saveFactory($('fv').value)">Saqlash</button>`);

function factoryHere() {
  const ok = (lat, lon) => saveFactory(`${lat.toFixed(6)}, ${lon.toFixed(6)}`);
  const fail = () => toast("Joylashuvni olib bo'lmadi. Koordinatani kiriting.", 4000);
  const browser = () => navigator.geolocation ? navigator.geolocation.getCurrentPosition((p) => ok(p.coords.latitude, p.coords.longitude), fail, { enableHighAccuracy: true, timeout: 15000 }) : fail();
  const lm = tgw.LocationManager;
  if (lm && tgw.isVersionAtLeast?.("8.0")) lm.init(() => (lm.isLocationAvailable ? lm.getLocation((d) => (d ? ok(d.latitude, d.longitude) : lm.isAccessGranted ? fail() : lm.openSettings())) : browser()));
  else browser();
}
async function saveFactory(v) {
  const r = await run(() => call("a_setting", { key: "factory", value: String(v || "").trim() }), "✅ Zavod joylashuvi saqlandi");
  if (r) { S.d.settings = r.settings; closeAll(); render(); }
}
async function backup() { await run(() => call("a_backup"), "💾 Zaxira nusxa Telegram'ingizga yuborildi"); }
